# Example Configuration for TeamTalk Telegram Sender Bot

[general]
# Default language for bot messages if user's language is not supported or detected.
# Supported codes should ideally be defined in the bot (e.g., 'en', 'ru', 'uk').
default_lang = "en"

# Gender neutrality for bot's persona in languages where it matters.
# Options might be 'neutral', 'masculine', 'feminine'.
gender = "neutral"

# Username of the bot admin (used for display or specific commands if any)
admin_username = "" # Optional: Bot admin's username (e.g., for TeamTalk)

[database]
# Path to the SQLite database file. Can be relative to project root or absolute.
db_file = "bot_data.db"

[telegram]
# Telegram Bot API token for event polling (e.g., user messages to bot, commands)
# This is the main bot token.
event_token = "YOUR_TELEGRAM_BOT_EVENT_TOKEN_HERE" # Replace with your bot's token

# Telegram Bot API token for sending messages (if different from event_token, otherwise can be the same)
# Often, the same token is used for both receiving and sending.
message_token = "YOUR_TELEGRAM_BOT_MESSAGE_TOKEN_HERE" # Replace or use same as event_token

# Telegram Chat ID of the administrator for receiving administrative notifications or alerts from the bot.
admin_chat_id = 0 # Replace with the actual admin's Telegram Chat ID (integer)

[teamtalk]
# TeamTalk server connection details
host_name = "teamtalk.example.com" # TeamTalk server address
port = 10333 # TeamTalk server port (default is 10333 for unencrypted)
encrypted = false # Set to true if connecting to an encrypted TeamTalk port

# TeamTalk user credentials for the bot
user_name = "BotUser" # Username for the bot on the TeamTalk server
password = "BotPassword" # Password for the bot user

# TeamTalk channel details
channel = "/Root/Public Channel" # Full path to the TeamTalk channel the bot should monitor/interact in
channel_password = "" # Password for the channel, if it's password-protected

# Bot's appearance on TeamTalk
nick_name = "NotifierBot" # Nickname the bot will use on TeamTalk
status_text = "Forwarding notifications to Telegram" # Status message for the bot on TeamTalk
client_name = "TTTelegramBotV1" # Client name string reported by the bot to the TeamTalk server

# TeamTalk server name (optional, for display or identification if managing multiple servers)
server_name = "My Primary TeamTalk Server"

# List of TeamTalk usernames to globally ignore for notifications (e.g., other bots, noisy users).
# These users' join/leave events or messages will not be processed or forwarded.
global_ignore_usernames = ["AnotherBot", "SystemUser"]

[operational_parameters]
# Time-to-live (TTL) for deeplinks generated by the bot, in seconds.
deeplink_ttl_seconds = 300 # 5 minutes

# Time in seconds to wait before retrying a connection to the TeamTalk server after a disconnect.
tt_reconnect_retry_seconds = 15

# Interval in seconds at which to check TeamTalk connection status if disconnected and attempt reconnect.
tt_reconnect_check_interval_seconds = 10

# Interval in seconds for synchronizing the cache of online users from TeamTalk.
online_users_cache_sync_interval_seconds = 300 # 5 minutes
