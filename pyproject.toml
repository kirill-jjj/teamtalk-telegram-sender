[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"


[project]
name = "teamtalk-telegram-sender"
version = "0.1.0"
description = "A bot that bridges TeamTalk 5 server events (user join/leave) to Telegram notifications and forwards PMs."
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = "GPL-3.0-or-later"
authors = [
    {name = "kirill-jjj", email = "kirillkolovi@gmail.com"},
]
keywords = ["teamtalk", "telegram", "bot", "notifications", "aiogram", "pytalk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Typing :: Typed",
]

dependencies = [
    "aiogram~=3.20",
    "py-talk-ex~=1.6",
    "python-dotenv~=1.1",
    "SQLAlchemy~=2.0",
    "aiosqlite~=0.21",
    'uvloop~=0.21; sys_platform != "win32"',
    "Babel~=2.15",
    "pydantic-settings~=2.9",
    "pydantic~=2.11",
    "sqlmodel~=0.0",
    "alembic~=1.16",
    "cachetools~=6.1",
    "toml~=0.10", # For writing TOML files (e.g., in env-to-toml script)
    "types-toml", # For mypy toml type checking
    "dishka~=1.7.2"
]

[project.urls]
Homepage = "https://github.com/kirill-jjj/teamtalk-telegram-sender"
Repository = "https://github.com/kirill-jjj/teamtalk-telegram-sender"
Issues = "https://github.com/kirill-jjj/teamtalk-telegram-sender/issues"

[tool.setuptools]
py-modules = ["sender"]

[tool.setuptools.packages.find]
where = ["."]  # Search for packages in the root directory
exclude = ["tests*"] # Exclude test packages

[tool.ruff]
target-version = "py311"
src = ["bot", "scripts", "sender.py"]
respect-gitignore = true
exclude = [
    "alembic.ini",
    "babel.cfg",
]
line-length = 88
indent-width = 4

[tool.ruff.lint]
preview = true
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "A", "SIM", "T20", "PT", "RUF",
    "D", "ERA", "ISC", "G", "PL", "ASYNC", "S", "ANN", "ARG",
    "N",
    "PTH",
    "PIE",
    "DTZ",
    "RET",
    "TRY",
    "FBT",
    "C90",
    "TID",
    "PERF",
]
ignore = [
    "D203",
    "D213",
    "PLR0913",
    "PLR0915", # Ignore too many statements in a function
    "TRY301", # Abstract `raise` to an inner function
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "RUF001", # Ignore ambiguous unicode character rule, as we use emojis
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/*" = ["D", "S101", "S105", "S106"]
"alembic/versions/*" = ["D", "C901"]
"scripts/*" = ["T201", "S603", "S607"]
"sender.py" = ["T201"]
"bot/config.py" = ["E501"]
"bot/telegram_bot/handlers/*" = ["ARG001"]
"bot/teamtalk_bot/event_handler.py" = ["C901"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["bot", "scripts"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[project.scripts]
# Original command
teamtalk-telegram-sender = "sender:main_cli"

# New aliases
bot = "sender:main_cli"
sender = "sender:main_cli"

# System scripts
migrate = "scripts.run_alembic:main"
i18n = "scripts.manage_locales:main"
env-to-toml = "scripts.env_to_toml:main"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["ai-docs"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
    "types-toml",
    "pydantic", # Add pydantic to dev dependencies for mypy plugin
]

[tool.mypy]
strict = true
files = ["bot", "scripts", "sender.py"]
exclude = [
    "alembic/versions/.*\\.py$",
    "\\.venv",
    
    "build/", # Exclude the build directory from mypy checking
]
ignore_missing_imports = true
plugins = [
  "pydantic.mypy"
]
python_version = "3.11"
show_error_context = true

[[tool.mypy.overrides]]
module = "bot.core.notifications"
ignore_errors = true